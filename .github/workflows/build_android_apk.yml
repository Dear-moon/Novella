name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK type
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - signed
  pull_request:
    branches: ["v2.a"]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/build_android_apk.yml"
  push:
    branches: ["v2.a"]
    tags: ["v*"]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/build_android_apk.yml"

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-apk:
    name: Build Unsigned APK
    # Automatic events and the default manual mode never receive signing secrets.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.build_type == 'unsigned'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Build Metadata
        run: |
          set -euo pipefail
          git fetch --no-tags origin v2.a:refs/remotes/origin/v2.a

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BUILD_NUMBER="$(git rev-list --count origin/v2.a)"
            BUILD_CHANNEL="pr"
            BUILD_LABEL="PR #${{ github.event.pull_request.number }}"
            ARTIFACT_ID="pr-${{ github.event.pull_request.number }}-${GITHUB_SHA:0:7}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Release tag must use vX.Y.Z format: $GITHUB_REF_NAME"
              exit 1
            fi
            BUILD_NUMBER="$(git rev-list --count HEAD)"
            BUILD_CHANNEL="tag"
            BUILD_LABEL="Build $BUILD_NUMBER"
            ARTIFACT_ID="$GITHUB_REF_NAME"
          elif [ "$GITHUB_REF_NAME" = "v2.a" ]; then
            BUILD_NUMBER="$(git rev-list --count HEAD)"
            BUILD_CHANNEL="v2.a"
            BUILD_LABEL="Build $BUILD_NUMBER"
            ARTIFACT_ID="v2.a-${GITHUB_SHA:0:7}"
          else
            BUILD_NUMBER="$(git rev-list --count HEAD)"
            BUILD_CHANNEL="branch"
            BUILD_LABEL="$GITHUB_REF_NAME"
            SAFE_REF="${GITHUB_REF_NAME//\//-}"
            ARTIFACT_ID="branch-${SAFE_REF}-${GITHUB_SHA:0:7}"
          fi

          {
            echo "APP_BUILD_NUMBER=$BUILD_NUMBER"
            echo "APP_BUILD_CHANNEL=$BUILD_CHANNEL"
            echo "APP_BUILD_LABEL=$BUILD_LABEL"
            echo "APP_ARTIFACT_ID=$ARTIFACT_ID"
          } >> "$GITHUB_ENV"

      - name: Verify release tag target
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --no-tags origin v2.a:refs/remotes/origin/v2.a
          git merge-base --is-ancestor "$GITHUB_SHA" origin/v2.a || {
            echo "::error::Release tag must point to a commit reachable from v2.a."
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --non-interactive --no-install --platform android

      # Enhanced caching（v6 默认）：带 restore keys 与本地 build cache，
      # 避免 Basic provider 因 prebuild 动态 versionCode 导致的永久 cache miss。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show build environment
        run: |
          echo "BUILD_CHANNEL=${{ env.APP_BUILD_CHANNEL }}"
          echo "BUILD_LABEL=${{ env.APP_BUILD_LABEL }}"
          echo "BUILD_NUMBER=${{ env.APP_BUILD_NUMBER }}"
          node --version
          java -version

      - name: Build unsigned APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK not signed
        run: |
          set -euo pipefail
          APK_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK_PATH"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          if "$APKSIGNER" verify "$APK_PATH" 2>/dev/null; then
            echo "::error::Expected unsigned APK but verification succeeded."
            exit 1
          fi

      - name: Collect APK
        run: |
          set -euo pipefail
          APK_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK_PATH"
          cp "$APK_PATH" "novella-${{ env.APP_ARTIFACT_ID }}-unsigned.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: novella-android-unsigned-apk-${{ env.APP_ARTIFACT_ID }}
          path: novella-*-unsigned.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-signed-apk:
    name: Build Signed APK
    # Signed builds run only when explicitly selected in a manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.build_type == 'signed'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for secret_name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              missing+=("$secret_name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing required signing secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Build Metadata
        run: |
          set -euo pipefail
          git fetch --no-tags origin v2.a:refs/remotes/origin/v2.a

          RELEASE_VERSION=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Release tag must use vX.Y.Z format: $GITHUB_REF_NAME"
              exit 1
            fi
            RELEASE_VERSION="${BASH_REMATCH[1]}"
            BUILD_NUMBER="$(git rev-list --count HEAD)"
            BUILD_CHANNEL="tag"
          elif [ "$GITHUB_REF_NAME" = "v2.a" ]; then
            BUILD_NUMBER="$(git rev-list --count HEAD)"
            BUILD_CHANNEL="v2.a"
          else
            BUILD_NUMBER="$(git rev-list --count origin/v2.a)"
            BUILD_CHANNEL="branch"
          fi
          BUILD_LABEL="Build $BUILD_NUMBER"

          {
            echo "APP_VERSION=$RELEASE_VERSION"
            echo "APP_BUILD_NUMBER=$BUILD_NUMBER"
            echo "APP_BUILD_CHANNEL=$BUILD_CHANNEL"
            echo "APP_BUILD_LABEL=$BUILD_LABEL"
          } >> "$GITHUB_ENV"

      - name: Verify release tag target
        # Manual tag builds must come from the maintained branch before using secrets.
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --no-tags origin v2.a:refs/remotes/origin/v2.a
          git merge-base --is-ancestor "$GITHUB_SHA" origin/v2.a || {
            echo "::error::Release tag must point to a commit reachable from v2.a."
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate Android project
        working-directory: apps/mobile
        env:
          # 只开启签名模式，不传任何实际密钥；密码在 Build signed APK 步骤
          # 通过环境变量提供，避免进 build.gradle 后被 Gradle cache 缓存。
          ENABLE_ANDROID_SIGNING: "1"
        run: npx expo prebuild --non-interactive --no-install --platform android

      # Enhanced caching（v6 默认）：带 restore keys 与本地 build cache，
      # 避免 Basic provider 因 prebuild 动态 versionCode 导致的永久 cache miss。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Keystore
        # prebuild 之后执行：android/ 是生成产物，checkout 时不存在。
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ENCODED_STRING" | base64 --decode > apps/mobile/android/app/release.keystore
          test -s apps/mobile/android/app/release.keystore

      - name: Show build environment
        run: |
          echo "BUILD_CHANNEL=${{ env.APP_BUILD_CHANNEL }}"
          echo "BUILD_LABEL=${{ env.APP_BUILD_LABEL }}"
          echo "BUILD_NUMBER=${{ env.APP_BUILD_NUMBER }}"
          echo "RELEASE_VERSION=${{ env.APP_VERSION }}"
          node --version
          java -version

      - name: Build signed APK
        working-directory: apps/mobile/android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK_PATH"

      - name: Collect APK
        run: |
          set -euo pipefail
          APK_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"

          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          test -n "$AAPT"

          VERSION="$(
            "$AAPT" dump badging "$APK_PATH" 2>/dev/null |
              grep -o "versionName='[^']*'" |
              head -1 |
              cut -d"'" -f2
          )"
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to read versionName from APK."
            exit 1
          fi
          if [ -n "${{ env.APP_VERSION }}" ] && [ "$VERSION" != "${{ env.APP_VERSION }}" ]; then
            echo "::error::Built version $VERSION does not match tag version ${{ env.APP_VERSION }}"
            exit 1
          fi

          cp "$APK_PATH" "novella-${VERSION}-${{ env.APP_BUILD_NUMBER }}-signed.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: novella-android-signed-apk
          path: novella-*-signed.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
