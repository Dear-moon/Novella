name: Deploy Novella Site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novella-site
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          for secret_name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!secret_name}" ]; then
              missing+=("$secret_name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing required Cloudflare secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Manual deployments always publish the maintained branch.
          ref: v2.a
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        # 仅此步骤需要 GitHub token（fetch-site-data 拉取 releases/latest）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_URL: ${{ vars.SITE_URL || 'https://novella.celia.sh' }}
        run: npm run build --workspace @novella/site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy apps/site/dist --project-name=${{ vars.CF_PAGES_PROJECT_NAME || 'novella' }}
