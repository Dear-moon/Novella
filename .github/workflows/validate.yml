name: Validate

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, boundaries and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check shared package boundaries
        run: npm run check:boundaries

      - name: Typecheck
        run: npm run typecheck

      - name: Run client tests
        run: npm run test:client

      - name: Verify Expo production bundle
        working-directory: apps/mobile
        run: npx expo export --platform all --output-dir /tmp/novella-export

      - name: Build public site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build --workspace @novella/site
